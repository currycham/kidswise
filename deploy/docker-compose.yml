# 服务器上的目录布局（由 deploy.sh 同步）：
#   ~/waywise/docker-compose.yml
#   ~/waywise/agent/                 ← agent 源码 + .env
#   ~/waywise/agent-state/waywise.db  ← 对话、记忆、掌握度
#   ~/waywise/xiaozhi/data/.config.yaml
#   ~/waywise/xiaozhi/data/waywise-prompt.txt
#   ~/waywise/xiaozhi/models/SenseVoiceSmall/model.pt
services:
  agent:
    build: ./agent
    container_name: waywise-agent
    restart: always
    env_file: ./agent/.env
    environment:
      - TZ=Asia/Shanghai
    # 不对公网暴露，只给同一网络里的 xiaozhi 调用；本机调试用 127.0.0.1:8080
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./agent-state:/app/state   # SQLite 数据库，重建容器不丢

  xiaozhi:
    # 官方镜像 + Pillow（白平衡校正用），见 xiaozhi-image/Dockerfile
    build: ./xiaozhi-image
    image: waywise-xiaozhi
    container_name: xiaozhi-esp32-server
    restart: always
    depends_on:
      - agent
    security_opt:
      - seccomp:unconfined
    environment:
      - TZ=Asia/Shanghai
      # 照片需要顺时针转的角度：裸板正放 0；装进木米外壳后主板转了 90°，按第一张实拍照片定 90 或 270
      - WAYWISE_CAMERA_ROTATE=0
    ports:
      - "8000:8000"   # 板子的 WebSocket
      - "8003:8003"   # OTA + Web 测试页 + 视觉接口
    volumes:
      - ./xiaozhi/data:/opt/xiaozhi-esp32-server/data
      - ./xiaozhi/models/SenseVoiceSmall/model.pt:/opt/xiaozhi-esp32-server/models/SenseVoiceSmall/model.pt
      # 补丁：拍照结果交回 agent（见 deploy/xiaozhi/patches/vision_handler.py 顶部注释处）
      - ./xiaozhi/patches/vision_handler.py:/opt/xiaozhi-esp32-server/core/api/vision_handler.py:ro
      # 补丁：设备工具失败时交回 agent，不把错误信息念给孩子
      - ./xiaozhi/patches/mcp_executor.py:/opt/xiaozhi-esp32-server/core/providers/tools/device_mcp/mcp_executor.py:ro
